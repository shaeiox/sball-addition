# sball-addition configuration
#
# Every value below is optional: the built-in defaults are identical to this
# file, so an empty file is a valid configuration. Reload hints:
#   sballd   - re-reads this file on every start (the wrapper calls the CLI)
#   watcher  - send SIGHUP to reload the log file, restart it to pick up
#              interval/timeout changes
#
# Paths: /etc/sball-addition/sball-addition.conf

[general]
# debug | info | warn | error
log_level = info
# JSON lines log file; the hooks receive it as $SBALL_LOG_FILE
log_file = /var/log/sball-addition/sball-addition.log
# PVM/sballd XML-RPC socket (see "pvm --stat")
socket_host = 127.0.0.1
socket_port = 7090
# timeout applied to hooks that do not set TIMEOUT themselves (seconds)
default_timeout = 60

[pre-quorate]
# run the pre-quorate hooks at all
enabled = true
# abort = a failing hook stops the sballd start, continue = only log it
on_failure = abort
# when no pre-quorate hook exists: true = start anyway, false = refuse to start
continue_on_empty = true

[post-quorate]
# run the post-quorate hooks at all
enabled = true
# how often the watcher polls the socket for the quorate state
poll_interval_seconds = 2
# how long the watcher waits for quorate before giving up (0 is not allowed)
poll_timeout_seconds = 300
# abort | continue - the default when a hook does not set ON_FAIL
on_failure = continue
