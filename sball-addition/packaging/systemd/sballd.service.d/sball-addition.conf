# Installed by sball-addition (or its RPM) as
#   /etc/systemd/system/sballd.service.d/sball-addition.conf
#
# It makes systemd start the hook aware wrapper instead of the daemon itself.
# The empty ExecStart line resets the value defined in the main unit file.
#
# Remove this file (or run "sball-addition-uninstall") to go back to a plain
# /usr/sbin/sballd start; remember to run "systemctl daemon-reload".

[Service]
ExecStart=
ExecStart=/usr/bin/sballd-wrapper
